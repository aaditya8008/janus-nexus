spring.application.name=janus-gateway-service
server.port=8080
info.app.name=Janus Gateway Service
info.app.description=API gateway for request routing, security, and traffic management
management.api.username=${JANUS_GATEWAY_MANAGEMENT_API_USERNAME:gateway-service}
management.api.password=${JANUS_GATEWAY_MANAGEMENT_API_PASSWORD:gateway123}
management.api.base-url=${JANUS_GATEWAY_MANAGEMENT_API_BASE_URL:http://localhost:8081}

gateway.kafka.configuration-topic=${JANUS_GATEWAY_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway.kafka.configuration-group=${JANUS_GATEWAY_CONFIGURATION_GROUP:smart-gateway-configuration}
spring.kafka.bootstrap-servers=${JANUS_GATEWAY_KAFKA_SERVERS:localhost:9092}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer